<main
  [attr.data-theme]="currentTheme"
  class="flex bg-surface grow gap-6 p-6 items-center justify-center min-h-[400px]"
>
  <fa-icon
    [icon]="faPalette"
    class="absolute text-text-main top-2 right-2 cursor-pointer"
  ></fa-icon>
  <app-theme-dropdown></app-theme-dropdown>
  <div
    data-theme="tokyo-night"
    class="w-80 p-8 bg-surface text-text-main rounded-xl border border-2 border-accent"
  >
    <h2 class="text-xl font-bold mb-4">Dark Container</h2>
    <p class="text-text-main opacity-80 text-sm mb-6">
      Standard slate-gray background with electric blue primary accent.
    </p>
    <button
      class="bg-primary text-text-main hover:opacity-90 px-4 py-2 rounded font-medium transition-opacity"
    >
      Click Me
    </button>
  </div>

  <div
    data-theme="gruvbox"
    class="w-80 p-8 bg-surface text-text-main rounded-xl border border-2 border-accent"
  >
    <h2 class="text-xl font-bold mb-4">Dark Container</h2>
    <p class="text-text-main opacity-80 text-sm mb-6">
      Standard slate-gray background with electric blue primary accent.
    </p>
    <button
      class="bg-primary text-text-main hover:opacity-90 px-4 py-2 rounded font-medium transition-opacity"
    >
      Click Me
    </button>
  </div>
</main>
