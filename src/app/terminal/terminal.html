<div class="relative flex h-full min-h-0 flex-col" (click)="focusCapture()">
  <!-- The scroller: the only element in the app that scrolls. -->
  <div
    #scroller
    class="min-h-0 grow overflow-y-auto p-4 font-terminal leading-terminal text-terminal sm:p-6"
    (scroll)="onScroll($event)"
  >
    @for (line of scrollback(); track $index) {
      <p class="break-all whitespace-pre-wrap" [class.prompt-gap]="showsGapBefore(line.kind)">
        @for (seg of segmentsFor(line.kind); track $index) {
          <span [class]="seg.classes">{{ seg.text }}</span>
        }
        <span>{{ line.text }}</span>
      </p>
    }

    <!--
      The block being typed, one <p> per logical line. The caret only exists on
      the last one and still simply trails that line's text, so the browser
      places it and no cell math is needed.
    -->
    @for (line of logicalLines(); track $index) {
      <p
        class="break-all whitespace-pre-wrap"
        [class.prompt-gap]="showsGapBefore($index === 0 ? 'primary' : 'continuation')"
      >
        @for (seg of liveSegments($index === 0); track $index) {
          <span [class]="seg.classes">{{ seg.text }}</span>
        }
        <span>{{ line }}</span>
        @if ($last) {
          <span class="caret" [class.caret--steady]="typing()"></span>
        }
      </p>
    }
  </div>

  <!--
    The only thing that receives keystrokes. Invisible but never aria-hidden:
    it is focusable, so hiding it from assistive tech would be a violation.
    Fixed rather than absolutely positioned so it cannot extend the scroll area
    of any ancestor, and deliberately outside the tab order — focus is managed
    by clicking the surface above.
  -->
  <input
    #capture
    class="capture"
    type="text"
    tabindex="-1"
    aria-label="Terminal input"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    (keydown)="onKeydown($event)"
    (beforeinput)="onBeforeInput($event)"
    (input)="onInput($event)"
  />
</div>
