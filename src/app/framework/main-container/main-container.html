<main
  [attr.data-theme]="currentTheme()"
  class="flex min-h-0 grow flex-col overflow-x-hidden bg-surface pt-safe pr-safe pb-safe pl-safe text-foreground"
>
  <header class="flex justify-end p-4 pb-0 sm:p-6 sm:pb-0">
    <!-- Explicit pair rather than [(selectedId)]: chooseTheme is the save hook,
         and two-way binding would write the signal without going through it. -->
    <app-theme-dropdown [selectedId]="currentTheme()" (selectedIdChange)="chooseTheme($event)" />
  </header>

  <!-- Fills exactly what is left under the header: main is a definite-height
       flex column, and min-h-0 lets this shrink instead of growing the page. -->
  <app-terminal class="min-h-0 grow" [theme]="currentTheme()" />

  @if (showGallery()) {
    <section class="min-h-0 grow p-4 sm:p-6">
      <app-card-grid>
        @for (theme of themes; track theme.id) {
          <app-card [theme]="theme.id" [title]="theme.name" [subtitle]="theme.id">
            <!-- Palette preview: each swatch resolves against this card's own theme -->
            <div class="flex gap-2">
              <span class="h-5 w-5 rounded-full border border-border bg-surface"></span>
              <span class="h-5 w-5 rounded-full border border-border bg-primary"></span>
              <span class="h-5 w-5 rounded-full border border-border bg-accent"></span>
            </div>

            <button
              card-action
              class="rounded bg-primary px-4 py-2 font-medium text-surface transition-opacity hover:opacity-90"
            >
              Click Me
            </button>
          </app-card>
        }
      </app-card-grid>
    </section>
  }
</main>
