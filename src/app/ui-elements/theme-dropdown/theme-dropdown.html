<div class="relative inline-block text-left">
  <!-- Dropdown Trigger Button -->
  <button
    (click)="isOpen.set(!isOpen())"
    class="inline-flex items-center gap-2 px-3.5 py-2 text-sm font-medium rounded-lg bg-card border border-border text-foreground hover:bg-muted transition-colors shadow-sm cursor-pointer"
  >
    <span class="w-2.5 h-2.5 rounded-full bg-primary"></span>
    <span
      >Theme: <strong class="capitalize">{{ currentThemeName() }}</strong></span
    >
    <svg
      class="w-4 h-4 text-muted-foreground transition-transform duration-200"
      [class.rotate-180]="isOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu Panel -->
  @if (isOpen()) {
    <!-- Backdrop to close when clicking outside -->
    <div class="fixed inset-0 z-40" (click)="isOpen.set(false)"></div>

    <div
      class="absolute right-0 mt-2 w-52 rounded-xl bg-card border border-border shadow-xl z-50 py-1.5 overflow-hidden backdrop-blur-md"
    >
      <div
        class="px-3 py-1.5 text-xs font-semibold text-muted-foreground uppercase tracking-wider border-b border-border/50"
      >
        Select Theme
      </div>

      <div class="max-h-60 overflow-y-auto py-1">
        @for (theme of themes; track theme.id) {
          <button
            (click)="selectTheme(theme)"
            class="w-full text-left px-3.5 py-2 text-sm text-foreground hover:bg-muted/80 transition-colors flex items-center justify-between cursor-pointer"
          >
            <span>{{ theme.name }}</span>
            @if (selectedId === theme.id) {
              <span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
