<div class="relative inline-block text-left">
  <!-- Dropdown Trigger Button -->
  <button
    (click)="isOpen.set(!isOpen())"
    class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-border bg-card px-3.5 py-2 text-sm font-medium text-foreground shadow-sm transition-colors hover:bg-muted"
  >
    <span class="h-2.5 w-2.5 rounded-full bg-primary"></span>
    <span
      >Theme: <strong class="capitalize">{{ currentThemeName() }}</strong></span
    >
    <svg
      class="h-4 w-4 text-muted-foreground transition-transform duration-200"
      [class.rotate-180]="isOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu Panel -->
  @if (isOpen()) {
    <!-- Backdrop to close when clicking outside -->
    <div class="fixed inset-0 z-40" (click)="isOpen.set(false)"></div>

    <div
      class="absolute right-0 z-50 mt-2 w-52 max-w-[calc(100vw-2rem)] overflow-hidden rounded-xl border border-border bg-card py-1.5 shadow-xl"
    >
      <div
        class="border-b border-border px-3 py-1.5 text-xs font-semibold uppercase tracking-wider text-muted-foreground"
      >
        Select Theme
      </div>

      <div class="max-h-60 overflow-y-auto py-1">
        @for (theme of themes; track theme.id) {
          <button
            (click)="selectTheme(theme)"
            class="flex w-full cursor-pointer items-center justify-between px-3.5 py-2 text-left text-sm text-foreground transition-colors hover:bg-muted"
          >
            <span>{{ theme.name }}</span>
            @if (selectedId() === theme.id) {
              <span class="h-1.5 w-1.5 rounded-full bg-primary"></span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
